name: ci

# Canonical scitex CI — thin org-reusable caller (the ONE per-repo shape).
# Job bodies live ONCE, org-side, in scitex-ai/.github@main.
# Shared workflows admit trusted actors to the compute pool. Required-context
# relays run only fixed result checks on hosted runners, without checkout/secrets.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    with:
      full_python_versions: '["3.11","3.12","3.13"]'
      ordinary_pr_python: ''
      pre_test_command: |
        owned=$(mktemp -d "${RUNNER_TEMP:?}/scitex-matrix-context.XXXXXXXX")
        mkdir -p "$owned/tmp" "$owned/cache" "$owned/config" "$owned/scitex" "$owned/mpl"
        for pair in "SCITEX_DIR=$owned/scitex" "TMPDIR=$owned/tmp" "XDG_CACHE_HOME=$owned/cache" "XDG_CONFIG_HOME=$owned/config" "MPLCONFIGDIR=$owned/mpl" "MPLBACKEND=Agg" "PIP_CACHE_DIR=$owned/cache/pip" "UV_CACHE_DIR=$owned/cache/uv" "PYTHONPYCACHEPREFIX=$owned/cache/pycache" "RUN_E2E=1"; do
          printf '%s\n' "$pair" >> "${GITHUB_ENV:?}"
        done
    secrets: inherit

  # Both protected branches require these bare legacy names. Relay the complete
  # shared matrix result instead of rerunning a weaker fallback/retry suite.
  # Non-success includes failure, cancellation and skipped/missing execution.
  required-test-contexts:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    needs: [pytest-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Require the complete shared matrix
        env:
          FULL_MATRIX_RESULT: ${{ needs.pytest-matrix.result }}
        run: |
          set -euo pipefail
          test "$FULL_MATRIX_RESULT" = success

  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    with:
      console_script: scitex
    secrets: inherit

  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit

  rtd-sphinx-build:
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main
    secrets: inherit
