name: release

# Tag-driven release pipeline. The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest. Must pass or the pipeline halts;
#                      nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist, uploaded as workflow artifact.
#   3. publish       — PyPI via OIDC trusted publisher.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#   5. sync-main     — open a develop→main PR (admin-merge) so main
#                      always equals the latest released commit. Skipped
#                      if main already matches.
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    # Mirror the hardened `tests` matrix (pytest-matrix-on-ubuntu-*.yml): the
    # release gate MUST use the same install + run recipe, or it reintroduces
    # the chronic failures #19 fixed (pip wrapt resolver-thrash -> ~50min hang,
    # CUDA-torch segfault, non-deterministic C-ext shutdown crash). Keeping a
    # second, un-hardened copy here meant every release stalled at this gate.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        # uv resolves the graph in seconds; pip backtracks through dozens of
        # `wrapt` candidates at ~13s each (~50min) and hits the job cap.
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          # CPU-only torch FIRST so transitive torch resolves to the CPU build;
          # default CUDA wheels segfault the suite on a GPU-less runner.
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu \
            || echo "CPU torch pre-install skipped (torch may be optional in this resolve)"
          uv pip install --system -e ".[all,dev]" \
            || uv pip install --system -e ".[dev]" \
            || uv pip install --system -e .
      - name: Install peer standalones aliased by the umbrella
        run: |
          uv pip install --system \
            scitex-dsp scitex-gen scitex-pd scitex-nn scitex-resource \
            scitex-linalg scitex-datetime scitex-decorators \
          || echo "peer standalones partially unavailable; identity test will importorskip the rest"
      - name: Run tests
        # Pass/fail judged from the JUnit report, not the exit code: the deep
        # ecosystem C-extension stack (torch/numba/catboost) segfaults
        # NON-deterministically and can kill the process before the report is
        # written. Retry up to 3x on a crash-before-report; a finished run is
        # judged by the report (real failures still fail). e2e + the
        # cross-package import gate are quarantined (heavy/segfault-prone).
        run: |
          set +e
          for attempt in 1 2 3; do
            rm -f pytest-results.xml
            pytest tests/ --ignore=tests/e2e \
              --ignore=tests/integration/test_cross_package_imports.py \
              -p no:cacheprovider -o faulthandler_timeout=120 \
              --junitxml=pytest-results.xml
            if [ -f pytest-results.xml ]; then
              echo "pytest produced a report on attempt $attempt"
              break
            fi
            echo "::warning::attempt $attempt crashed before writing the report (C-extension shutdown/import segfault); retrying"
          done
          set -e
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("pytest-results.xml").getroot()
          except Exception as e:
              print(f"::error::no JUnit report after retries ({e}) — pytest never "
                    "finished; failing")
              sys.exit(1)
          suites = list(root.iter("testsuite"))
          bad = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          total = sum(int(s.get("tests", 0)) for s in suites)
          print(f"JUnit: {total} tests, {bad} failures+errors")
          sys.exit(1 if bad else 0)
          PY

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scitex
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

  sync-main:
    # Open develop→main PR so main always equals the latest released
    # commit. Branch-protected mains require PR review; this job tries
    # admin-merge but leaves the PR open if that isn't allowed.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
      - name: Open develop→main PR if diverged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          if [ "$AHEAD" -eq 0 ]; then
            echo "main already up-to-date with develop."
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            PR_URL=$(gh pr create --base main --head develop \
              --title "release: sync main with develop" \
              --body "Auto-opened by the release pipeline so main equals the latest released commit.")
            EXISTING=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #${EXISTING}"
          else
            echo "Reusing existing PR #${EXISTING}"
          fi
          gh pr merge "$EXISTING" --merge --admin \
            || echo "Admin merge unavailable; PR left open for manual merge."
