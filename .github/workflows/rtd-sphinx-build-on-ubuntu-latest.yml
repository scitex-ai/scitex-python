name: docs

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  sphinx:
    # Skip when HEAD is the bot's own previous docs auto-commit — breaks
    # the infinite loop without using `[skip ci]`, which would also
    # suppress the tag-push and release workflows when the auto-commit
    # is the most recent commit on develop at release time.
    if: "!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + docs deps
        run: pip install -e ".[docs]"

      - name: Build Sphinx HTML
        # `-W` (warnings → errors) was previously enabled on PRs only, but
        # the only warnings we surface come from autodoc'd docstrings in
        # peer packages (e.g. scitex_config / scitex_session /
        # figrecipe.pyplot's matplotlib re-exports). Those are upstream
        # docstring issues we can't fix from this repo, and develop's
        # build already runs without `-W`. Align PR builds with develop
        # so we don't gate merges on cosmetic upstream noise.
        run: sphinx-build -b html docs/sphinx docs/sphinx/_build/html

      - name: Refresh src/scitex/_sphinx_html/ (develop push only)
        # main is PR-only — its _sphinx_html/ bundle arrives via the
        # develop -> main PR. Direct bot-pushes to main are inhibited
        # so the branch history stays linear-via-PR.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          rm -rf src/scitex/_sphinx_html
          cp -rf docs/sphinx/_build/html src/scitex/_sphinx_html
          touch src/scitex/_sphinx_html/.nojekyll

      - name: Commit refreshed HTML if it changed (develop push only)
        # Best-effort: develop is a protected branch, so the bot push is
        # declined with GH006 ("protected branch hook declined"). The bundle
        # only needs to be current for production serving, which is refreshed
        # at release time via the develop -> main PR. The Sphinx BUILD step
        # above remains strict/required; only this commit-back is non-fatal so
        # the docs workflow stops going red on every develop push.
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          if [ -n "$(git status --porcelain src/scitex/_sphinx_html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/scitex/_sphinx_html
            git commit -m "docs(sphinx_html): refresh from CI build"
            git push
          fi
