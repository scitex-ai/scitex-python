name: Sync GitHub About

# Hourly refresh of the GitHub About line from LIVE scitex CLI:
#   modules = umbrella src/scitex/*/ public subpackages
#   cli     = leaf commands from `scitex --help-recursive --json`
#   mcp     = `scitex mcp list-tools --json` → total
#   skills  = sum of entries from `scitex skills list --json`

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/sync-about.yml'
      - 'scripts/compute_ecosystem_stats.py'
      - 'pyproject.toml'
  schedule:
    - cron: "0 * * * *"  # Hourly, top of every hour UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # cache is keyed on pyproject.toml — invalidates only when deps shift
          cache-dependency-glob: |
            pyproject.toml
            .github/workflows/sync-about.yml

      - name: Install scitex[all] + full ecosystem (via scitex-dev registry)
        run: |
          echo "wrapt>=1.17" > /tmp/c.txt
          export UV_CONSTRAINT=/tmp/c.txt
          # First install scitex-dev so we can query the canonical registry
          uv pip install --system scitex-dev
          # Then ask scitex-dev for every package in the ecosystem and
          # install them all so every MCP tool / CLI command registers.
          uv pip install --system ".[all]"
          # Filter out template / non-PyPI entries — they'd abort the whole batch.
          pkgs=$(scitex dev ecosystem list --json \
                 | python3 -c "import sys, json; d = json.load(sys.stdin); \
                               skip = {'scitex', 'automated-research-demo', \
                                       'singularity-template', 'pip-project-template', \
                                       'scitex-research-template'}; \
                               print(' '.join(p for p in d['packages'] if p not in skip))")
          echo "Installing ecosystem: $pkgs"
          uv pip install --system $pkgs || true

      - name: Compute ecosystem stats
        id: stats
        run: |
          about=$(python3 scripts/compute_ecosystem_stats.py --github-about)
          echo "about=$about" >> "$GITHUB_OUTPUT"
          echo "$about"

      - name: Sync GitHub repo description
        env:
          # PAT with administration:write stored as REPO_ADMIN_TOKEN.
          # Step no-ops when the secret is absent.
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" -X PATCH \
            -f description="${{ steps.stats.outputs.about }}" || true
