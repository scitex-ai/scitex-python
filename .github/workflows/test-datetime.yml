name: Datetime Module Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/scitex/datetime/**'
      - 'tests/scitex/datetime/**'
      - '.github/workflows/test-datetime.yml'
      - 'scripts/test-module.sh'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/scitex/datetime/**'
      - 'tests/scitex/datetime/**'

jobs:
  test:
    uses: ./.github/workflows/_test-module.yml
    with:
      module: datetime
      mode: editable
