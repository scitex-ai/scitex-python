name: Notebook Module Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/scitex/notebook/**'
      - 'tests/scitex/notebook/**'
      - '.github/workflows/test-notebook.yml'
      - 'scripts/test-module.sh'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/scitex/notebook/**'
      - 'tests/scitex/notebook/**'

jobs:
  test:
    uses: ./.github/workflows/_test-module.yml
    with:
      module: notebook
      mode: editable
