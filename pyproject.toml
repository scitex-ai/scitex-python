# ============================================
# SciTeX: Python Framework for Scientific Research
# https://scitex.ai
# ============================================

# /home/ywatanabe/proj/scitex-python/pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex"
version = "2.29.1"
description = "A comprehensive Python library for scientific computing and data analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" }
]
keywords = [
    "scientific-computing",
    "data-analysis",
    "machine-learning",
    "signal-processing",
    "neural-networks",
    "research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# ============================================
# Core Dependencies (Minimal - Always Installed)
# ============================================
# Philosophy: Keep core minimal. Users install what they need with:
#   pip install scitex[modulename]
#   pip install scitex[audio,scholar]  # multiple modules
#   pip install scitex[all]            # everything
dependencies = [
    # ============================================
    # Essential 3rd-party deps (always required)
    # ============================================
    "numpy",
    "pandas",
    "PyYAML",
    "tqdm",
    "packaging",
    "natsort",
    "beautifulsoup4>=4.12.0",
    # ============================================
    # Hard-pinned scitex-* leaf packages (small,
    # always installed). Each is pinned at the
    # exact PyPI-latest version at v2.29.0 cut
    # time. The umbrella CI runs
    #   scitex-dev ecosystem audit-umbrella-pins
    # which fails red if any pin lags PyPI latest.
    # ============================================
    "scitex-app==0.2.7",
    "scitex-audit==0.1.6",
    "scitex-benchmark==0.1.4",
    "scitex-bridge==0.1.9",
    "scitex-capture==0.1.2",
    "scitex-clew==0.2.8",
    "scitex-compat==0.1.7",
    "scitex-config==0.3.3",
    "scitex-context==0.1.3",
    "scitex-datetime==0.1.3",
    "scitex-db==0.1.9",
    "scitex-decorators==0.1.10",
    "scitex-dev==0.11.19",
    "scitex-dict==0.1.5",
    "scitex-etc==0.1.6",
    "scitex-events==0.1.3",
    "scitex-gen==0.1.7",
    "scitex-gists==0.1.6",
    "scitex-git==0.3.1",
    "scitex-introspect==0.1.6",
    "scitex-io==0.2.14",
    "scitex-linalg==0.1.3",
    "scitex-logging==0.1.6",
    "scitex-msword==0.1.3",
    "scitex-notebook==0.1.2",
    "scitex-notification==0.2.5",
    "scitex-os==0.1.5",
    "scitex-parallel==0.1.7",
    "scitex-path==0.1.6",
    "scitex-pd==0.1.4",
    "scitex-repro==0.1.5",
    "scitex-resource==0.4.1",
    "scitex-security==0.1.3",
    "scitex-session==0.1.6",
    "scitex-sh==0.1.3",
    "scitex-stats==0.2.19",
    "scitex-str==0.1.9",
    "scitex-template==0.6.6",
    "scitex-tex==0.1.6",
    "scitex-types==0.1.5",
    "scitex-web==0.1.4",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-python"
Documentation = "https://scitex.readthedocs.io"
Repository = "https://github.com/ywatanabe1989/scitex-python"
"Bug Tracker" = "https://github.com/ywatanabe1989/scitex-python/issues"

[project.scripts]
scitex = "scitex.__main__:main"
# Package-management CLI (venv drift detector for mgr-pkg autonomous ops)
scitex-pkg = "scitex.cli.pkg:pkg"
# MCP Server entry points (individual modules)
# scitex-audio entry point now in standalone scitex-audio package
scitex-capture = "scitex.capture.mcp_server:main"
scitex-diagram = "scitex.diagram.mcp_server:main"
# scitex-plt entry point now in standalone scitex-plt package
scitex-scholar = "scitex.scholar.mcp_server:main"
# scitex-stats entry point now in standalone scitex-stats package
scitex-template = "scitex_template.mcp_server:main"
# scitex-ui entry point now in standalone scitex-ui package
# Unified MCP Server (all modules in one)
scitex-mcp-server = "scitex.mcp_server:main"

[project.entry-points."scitex_dev.docs"]
scitex = "scitex"

[project.entry-points."scitex_dev.skills"]
scitex = "scitex"

# ============================================
# Optional Dependencies - Module-Oriented
# ============================================
# Install specific modules: pip install scitex[audio]
# Install multiple: pip install scitex[audio,scholar,stats]
# Install all: pip install scitex[all]

[project.optional-dependencies]
# ============================================
# Optional extras (opt-in heavy packages)
# Each leaf pinned at the PyPI-latest version
# at v2.29.0 cut time; audit-umbrella-pins
# blocks merges if any pin lags.
#
# Install with:
#   pip install "scitex[browser]"
#   pip install "scitex[ml,scholar]"
#   pip install "scitex[all]"   # everything
# ============================================

# --- Heavy single-package extras (each opt-in) ---
audio = ["scitex-audio==0.2.11"]
browser = ["scitex-browser==0.1.14"]
cloud = ["scitex-cloud==0.17.5"]
container = ["scitex-container==0.1.10"]
cv = ["scitex-cv==0.1.3"]
dataset = ["scitex-dataset==0.3.8"]
dsp = ["scitex-dsp==0.1.7"]
genai = ["scitex-genai==0.1.0"]
hpc = ["scitex-hpc==0.8.1"]
ml = ["scitex-ml==0.1.0"]
nn = ["scitex-nn==0.1.10"]
plt = ["scitex-plt==0.24.4", "figrecipe==0.28.9"]
scholar = ["scitex-scholar==1.3.1"]
seizure-metrics = ["scitex-seizure-metrics==0.1.1"]
ssh = ["scitex-ssh==1.0.0"]
ui = ["scitex-ui==0.4.8"]
writer = ["scitex-writer==2.17.0"]

# --- Operational extras (admin/infrastructure) ---
agent-container = ["scitex-agent-container==0.17.0"]
orochi = ["scitex-orochi==0.16.2"]

# --- External-lib extras (non scitex-* prefix) ---
newb = ["newb==0.26.6"]
socialia = ["socialia==0.5.9"]

# --- Aggregated extras ---
# Install everything in one shot. Mirrors the union of all extras above.
all = [
    "scitex-audio==0.2.11",
    "scitex-browser==0.1.14",
    "scitex-cloud==0.17.5",
    "scitex-container==0.1.10",
    "scitex-cv==0.1.3",
    "scitex-dataset==0.3.8",
    "scitex-dsp==0.1.7",
    "scitex-genai==0.1.0",
    "scitex-hpc==0.8.1",
    "scitex-ml==0.1.0",
    "scitex-nn==0.1.10",
    "scitex-plt==0.24.4",
    "figrecipe==0.28.9",
    "scitex-scholar==1.3.1",
    "scitex-seizure-metrics==0.1.1",
    "scitex-ssh==1.0.0",
    "scitex-ui==0.4.8",
    "scitex-writer==2.17.0",
    "scitex-agent-container==0.17.0",
    "scitex-orochi==0.16.2",
    "newb==0.26.6",
    "socialia==0.5.9",
]

# --- Development extras (test tooling, audits) ---
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-xdist",
    "mypy",
    "ruff",
    "black",
    "scitex-dev[dev]==0.11.19",
]

[tool.hatch.version]
path = "src/scitex/__version__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
exclude = [
    # Scholar development symlinks
    "src/scitex/scholar/.env",
    "src/scitex/scholar/.venv",
    "src/scitex/scholar/.claude",
    "src/scitex/scholar/crossref_local",
    "src/scitex/scholar/library",
    "src/scitex/scholar/docs/to_claude",
    "src/scitex/scholar/data/impact_factor/impact_factor.db",
]


[tool.hatch.build.targets.sdist]
exclude = [
    # Scholar development symlinks
    "src/scitex/scholar/.env",
    "src/scitex/scholar/.venv",
    "src/scitex/scholar/.claude",
    "src/scitex/scholar/crossref_local",
    "src/scitex/scholar/library",
    "src/scitex/scholar/docs/to_claude",
    "src/scitex/scholar/data/impact_factor/impact_factor.db",
]

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "-p", "no:warnings",
    "--ignore=tests/custom/old/",
    "--import-mode=importlib",
    "--timeout=60",
]
timeout_method = "signal"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async tests",
    "benchmark: marks tests as benchmark tests",
    "filterwarnings: marks tests to filter specific warnings",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src/scitex"]
branch = true
parallel = true
relative_files = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.old/*",
    "*/migrations/*",
    "*/conftest.py",
    "*/setup.py",
    "*/__main__.py",
    "*/versioneer.py",
    "*/_version.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if __name__ == .__main__.",
    "pass",
    "except ImportError:",
    "except ModuleNotFoundError:",
    "warnings.warn",
    "logger.debug",
    "logger.info",
]

[tool.coverage.paths]
source = [
    "src/scitex",
    "*/site-packages/scitex",
]

[tool.coverage.html]
directory = "htmlcov"
title = "SciTeX Coverage Report"
skip_covered = false
skip_empty = true

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["scitex"]
known_third_party = ["numpy", "pandas", "matplotlib", "scipy", "sklearn", "torch", "pytest"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/.old/*", "*/migrations/*", "*/__pycache__/*"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E266", "E501", "W503", "E731", "E402"]
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    ".eggs",
    "*.egg",
    ".tox",
    ".coverage",
    ".coveragerc",
    "htmlcov",
    ".pytest_cache",
    ".mypy_cache",
    "migrations",
]
per-file-ignores = [
    "__init__.py:F401,F403",
    "tests/*:F401,F403,F811",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
ignore_missing_imports = true
implicit_reexport = true
namespace_packages = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "setup"
ignore_errors = true

# ============================================
# Ruff Configuration
# ============================================

[tool.ruff]
target-version = "py38"
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg",
    ".old*",
    "migrations",
    "htmlcov",
    "docs/to_claude",
    "src/scitex/scholar/docs",
    "examples/*/docs",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "D",      # pydocstyle (NumPy-style docstrings)
]
ignore = [
    "E203",   # whitespace before ':'
    "E266",   # too many leading '#' for block comment
    "E501",   # line too long (handled by formatter)
    "E731",   # do not assign a lambda expression
    "E402",   # module level import not at top of file
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip() without an explicit strict= parameter
    # Docstring rules - relaxed for gradual adoption
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "D"]
"tests/*" = ["F401", "F403", "F811", "D"]
"**/tests/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["scitex"]
known-third-party = ["numpy", "pandas", "matplotlib", "scipy", "sklearn", "torch", "pytest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
