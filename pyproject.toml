# ============================================
# SciTeX: Python Framework for Scientific Research
# https://scitex.ai
# ============================================

# /home/ywatanabe/proj/scitex-python/pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex"
version = "2.30.1"
description = "A comprehensive Python library for scientific computing and data analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" }
]
keywords = [
    "scientific-computing",
    "data-analysis",
    "machine-learning",
    "signal-processing",
    "neural-networks",
    "research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# ============================================
# Core Dependencies (Minimal - Always Installed)
# ============================================
# Philosophy: Keep core minimal. Users install what they need with:
#   pip install scitex[modulename]
#   pip install scitex[audio,scholar]  # multiple modules
#   pip install scitex[all]            # everything
dependencies = [
    # ============================================
    # Essential 3rd-party deps (always required)
    # ============================================
    "numpy",
    "pandas",
    "PyYAML",
    "tqdm",
    "packaging",
    "natsort",  # Natural sorting - used by many modules
    "beautifulsoup4>=4.12.0",  # HTML parsing - used by web/cli modules
    # Config + env loading (scitex.helpers.load_scitex_env delegates here)
    "scitex-config==0.3.6",
    # Reproducibility Verification
    "scitex-clew==0.2.15",
    # App SDK — unified file storage for local + cloud
    "scitex-app==0.2.8",
    # Delegated core modules (thin re-exports)
    "scitex-dev>=0.17.6",
    "scitex-io==0.2.20",
    "scitex-stats==0.2.23",
    "scitex-audio==0.2.13",
    "scitex-notification==0.2.8",
    "scitex-notebook==0.1.2",
    # Delegated modules from #51 standalonization
    "scitex-db>=0.1.12",
    "scitex-scholar==1.4.1",
    "scitex-parallel==0.1.8",
    "scitex-types==0.1.6",
    "scitex-path==0.1.7",
    "scitex-repro==0.1.6",
    "scitex-compat==0.1.8",
    "scitex-etc==0.2.0",  # media shipped here; scitex.media re-exports scitex_etc.media
    "scitex-genai==0.1.0",
    "scitex-gists==0.1.7",
    "scitex-audit==0.1.7",
    "scitex-logging==0.1.7",
    "scitex-dict==0.1.7",
    "scitex-browser==0.1.15",
    "scitex-str==0.1.12",
    "scitex-benchmark==0.1.5",
    "scitex-context==0.1.4",
    "scitex-cv==0.1.5",
    "scitex-introspect==0.1.7",
    "scitex-msword>=0.3.2",
    "scitex-os==0.1.7",
    "scitex-security==0.1.4",
    "scitex-tex==0.1.7",
    "figrecipe==0.28.20",
    "scitex-ui==0.5.1",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-python"
Documentation = "https://scitex.readthedocs.io"
Repository = "https://github.com/ywatanabe1989/scitex-python"
"Bug Tracker" = "https://github.com/ywatanabe1989/scitex-python/issues"

[project.scripts]
scitex = "scitex.__main__:main"
# Package-management CLI (venv drift detector for mgr-pkg autonomous ops)
scitex-pkg = "scitex.cli.pkg:pkg"
# Unified MCP Server (all modules in one). Use `scitex serve` (preferred)
# or `scitex-mcp-server`. The umbrella's single MCP entrypoint
# (scitex._mcp) registry-mounts every peer's FastMCP server, so peer
# standalone packages (scitex-scholar, scitex-stats, scitex-capture, ...)
# need NOT re-declare per-module MCP scripts here — declaring legacy
# `scitex-<module>` shims would only collide with each peer's Click CLI
# and break shell-completion eval.
scitex-mcp-server = "scitex._mcp:main"

[project.entry-points."scitex_dev.docs"]
scitex = "scitex"

[project.entry-points."scitex_dev.skills"]
scitex = "scitex"

# NOTE: the umbrella no longer ships linter rules. STX-I/STX-S rules now live
# in scitex-dev (>=0.16.0, `scitex_dev.linter._rules`); the in-tree
# `_linter_plugin.py` + its `scitex_dev.linter.plugins` / `scitex_linter.plugins`
# entry points were dropped (Phase B).

# ============================================
# Optional Dependencies - Module-Oriented
# ============================================
# Install specific modules: pip install scitex[audio]
# Install multiple: pip install scitex[audio,scholar,stats]
